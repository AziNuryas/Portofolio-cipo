<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nabilah Aisha Syahada | Portofolio Keperawatan</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&family=Dancing+Script:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com">
    </script>
    
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- GSAP CDN -->

    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js">

    <!-- Babel CDN (buat JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js">
    </script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        rose: {
                            50: '#FFF0F3',
                            100: '#FFD0D9',
                            200: '#FFB0C0',
                            300: '#FF8FA7',
                            400: '#FF6F8E',
                            500: '#E82561',
                            600: '#C41E56',
                            700: '#A0184B',
                            800: '#7C1240',
                            900: '#580C35',
                        },
                        mint: {
                            50: '#E0F7F3',
                            100: '#BFF2E5',
                            200: '#80E6D1',
                            300: '#4FC2A8',
                            400: '#3DAF94',
                            500: '#2C9C80',
                        },
                        ink: {
                            50: '#F5F0F2',
                            100: '#E8E0E4',
                            200: '#D0C0C8',
                            300: '#A898A0',
                            400: '#807078',
                            500: '#4A3542',
                            600: '#2D1420',
                            700: '#1A0A12',
                            800: '#0D0509',
                            900: '#000000',
                        }
                    },
                    fontFamily: {
                        'display': ['Fraunces', 'serif'],
                        'sans': ['Plus Jakarta Sans', 'sans-serif'],

                }
            }
        }
    </script>

    <style>
        /* Custom Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #FFF0F3;
            color: #2D1420;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        ::selection {
            background: #E82561;
            color: #fff;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #FFF0F3;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #C41E56, #E82561);
            border-radius: 10px;
        }

        /* Glass Effect */
        .glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 176, 192, 0.3);
        }

        /* Gradient Text */
        .gradient-text {
            background: linear-gradient(135deg, #C41E56, #E82561, #FF6F8E);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Card Hover */
        .card-hover {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-hover:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 60px rgba(196, 30, 86, 0.3);
        }

        /* Floating Animation */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        .animate-float-slow {
            animation: float 8s ease-in-out infinite;
        }

        /* Pulse Glow */
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(232, 37, 97, 0.3); }
            50% { box-shadow: 0 0 40px rgba(232, 37, 97, 0.6); }
        }
        .animate-pulse-glow {
            animation: pulseGlow 2s ease-in-out infinite;
        }

        /* Aurora Background Animation */
        @keyframes aurora {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .aurora-bg {
            background: linear-gradient(270deg, #FFD0D9, #E0F7F3, #FFD0D9, #FFB0C0);
            background-size: 400% 400%;
            animation: aurora 15s ease infinite;
        }

        /* Splash Cursor */
        .splash-cursor {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(232, 37, 97, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s, background 0.3s;
        }
        .splash-cursor.hovering {
            width: 60px;
            height: 60px;
            background: rgba(232, 37, 97, 0.5);
        }

        /* Magnetic Button */
        .magnetic-btn {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Swiper Custom */
        .swiper {
            width: 300px;
            height: 400px;
        }
        .swiper-slide {
            border-radius: 24px;
            overflow: hidden;
        }
        .swiper-pagination-bullet-active {
            background: #E82561 !important;
        }
    </style>
</head>
<body>
    <!-- Splash Cursor -->
    <div class="splash-cursor" id="splashCursor"></div>

    <!-- Root React -->
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;
        const { motion, AnimatePresence, useScroll, useTransform, useSpring, useMotionValue } = window.framerMotion;

        // ==================== REACT BITS INSPIRED COMPONENTS ====================
        
        // Aurora Background Component (React Bits inspired)
        const AuroraBackground = ({ children, className = "" }) => {
            return (
                <div className={`relative overflow-hidden ${className}`}>
                    <div className="absolute inset-0 aurora-bg opacity-50" />
                    <div className="absolute inset-0 bg-gradient-to-b from-transparent via-transparent to-rose-50/80" />
                    <div className="relative z-10">{children}</div>
                </div>
            );
        };

        // Shiny Text Component (React Bits inspired)
        const ShinyText = ({ children, className = "" }) => {
            const [mousePos, setMousePos] = useState({ x: 0, y: 0 });
            const textRef = useRef(null);

            const handleMouseMove = (e) => {
                if (textRef.current) {
                    const rect = textRef.current.getBoundingClientRect();
                    setMousePos({
                        x: e.clientX - rect.left,
                        y: e.clientY - rect.top
                    });
                }
            };

            return (
                <span
                    ref={textRef}
                    onMouseMove={handleMouseMove}
                    className={`relative inline-block ${className}`}
                    style={{
                        background: `radial-gradient(circle at ${mousePos.x}px ${mousePos.y}px, #E82561 0%, #C41E56 30%, #2D1420 70%)`,
                        WebkitBackgroundClip: 'text',
                        WebkitTextFillColor: 'transparent',
                        backgroundClip: 'text',
                    }}
                >
                    {children}
                </span>
            );
        };

        // Magnet Lines Component (React Bits inspired)
        const MagnetLines = ({ children, className = "" }) => {
            const ref = useRef(null);
            const [position, setPosition] = useState({ x: 0, y: 0 });

            const handleMouseMove = (e) => {
                if (ref.current) {
                    const rect = ref.current.getBoundingClientRect();
                    setPosition({
                        x: e.clientX - rect.left,
                        y: e.clientY - rect.top
                    });
                }
            };

            return (
                <div
                    ref={ref}
                    onMouseMove={handleMouseMove}
                    className={`relative ${className}`}
                >
                    <div
                        className="absolute inset-0 opacity-20 pointer-events-none"
                        style={{
                            background: `radial-gradient(circle 200px at ${position.x}px ${position.y}px, rgba(232,37,97,0.3), transparent)`
                        }}
                    />
                    {children}
                </div>
            );
        };

        // Floating Shapes (React Bits inspired)
        const FloatingShapes = () => {
            const shapes = [
                { type: 'circle', size: 20, color: 'bg-rose-300', delay: 0, duration: 4, x: '10%', y: '20%' },
                { type: 'square', size: 15, color: 'bg-mint-300', delay: 1, duration: 5, x: '80%', y: '30%' },
                { type: 'circle', size: 25, color: 'bg-rose-400', delay: 2, duration: 6, x: '20%', y: '70%' },
                { type: 'triangle', size: 18, color: 'bg-mint-400', delay: 0.5, duration: 4.5, x: '70%', y: '60%' },
                { type: 'circle', size: 12, color: 'bg-rose-200', delay: 1.5, duration: 5.5, x: '50%', y: '10%' },
                { type: 'square', size: 22, color: 'bg-rose-500', delay: 3, duration: 7, x: '90%', y: '80%' },
            ];

            return (
                <div className="absolute inset-0 pointer-events-none overflow-hidden">
                    {shapes.map((shape, i) => (
                        <div
                            key={i}
                            className={`absolute ${shape.color} opacity-20 rounded-full`}
                            style={{
                                width: shape.size,
                                height: shape.size,
                                left: shape.x,
                                top: shape.y,
                                animation: `float ${shape.duration}s ease-in-out ${shape.delay}s infinite`,
                                borderRadius: shape.type === 'circle' ? '50%' : shape.type === 'square' ? '4px' : '0',
                                clipPath: shape.type === 'triangle' ? 'polygon(50% 0%, 0% 100%, 100% 100%)' : 'none',
                            }}
                        />
                    ))}
                </div>
            );
        };

        // ==================== PRELOADER ====================
        const Preloader = ({ onComplete }) => {
            useEffect(() => {
                const timer = setTimeout(onComplete, 2000);
                return () => clearTimeout(timer);
            }, [onComplete]);

            return (
                <motion.div
                    initial={{ opacity: 1 }}
                    exit={{ opacity: 0 }}
                    transition={{ duration: 0.6 }}
                    className="fixed inset-0 z-[99999] bg-gradient-to-br from-rose-50 via-white to-rose-50 flex flex-col items-center justify-center gap-4"
                >
                    <motion.div
                        animate={{ scale: [1, 1.3, 1], opacity: [1, 0.6, 1] }}
                        transition={{ duration: 1.5, repeat: Infinity }}
                        className="relative"
                    >
                        <div className="w-16 h-16 rounded-full bg-gradient-to-br from-rose-500 to-rose-600 flex items-center justify-center shadow-2xl animate-pulse-glow">
                            <i className="fas fa-heart text-white text-2xl"></i>
                        </div>
                    </motion.div>
                    <motion.p
                        animate={{ opacity: [0.5, 1, 0.5] }}
                        transition={{ duration: 1.5, repeat: Infinity }}
                        className="font-mono text-xs tracking-[0.3em] uppercase text-rose-600 font-bold"
                    >
                        Nabilah Aisha Syahada
                    </motion.p>
                </motion.div>
            );
        };

        // ==================== NAVBAR ====================
        const Navbar = ({ activeSection, setActiveSection }) => {
            const [isScrolled, setIsScrolled] = useState(false);
            const [isMobileOpen, setIsMobileOpen] = useState(false);

            useEffect(() => {
                const handleScroll = () => setIsScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const navItems = [
                { id: 'hero', label: 'Beranda', icon: 'fa-home' },
                { id: 'about', label: 'Tentang', icon: 'fa-user' },
                { id: 'experience', label: 'Pengalaman', icon: 'fa-briefcase' },
                { id: 'certs', label: 'Sertifikat', icon: 'fa-certificate' },
                { id: 'gallery', label: 'Momen', icon: 'fa-images' },
            ];

            const scrollToSection = (id) => {
                setActiveSection(id);
                document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });
                setIsMobileOpen(false);
            };

            return (
                <>
                    <motion.nav
                        initial={{ y: -100, opacity: 0 }}
                        animate={{ y: 0, opacity: 1 }}
                        transition={{ delay: 2.2, duration: 0.6 }}
                        className={`fixed top-3 left-1/2 -translate-x-1/2 z-[900] transition-all duration-500 rounded-full flex items-center gap-1 ${
                            isScrolled ? 'glass shadow-2xl px-3 py-2' : 'bg-white/90 shadow-lg px-4 py-2.5'
                        }`}
                    >
                        <motion.div
                            whileHover={{ scale: 1.05 }}
                            onClick={() => scrollToSection('hero')}
                            className="font-display font-bold text-base mr-2 cursor-pointer select-none"
                        >
                            nabilah<span className="text-rose-600 italic">.</span>
                        </motion.div>

                        <div className="hidden lg:flex items-center gap-0.5">
                            {navItems.map((item) => (
                                <motion.button
                                    key={item.id}
                                    onClick={() => scrollToSection(item.id)}
                                    whileHover={{ scale: 1.05 }}
                                    whileTap={{ scale: 0.95 }}
                                    className={`px-3 py-1.5 rounded-full text-xs font-semibold transition-all duration-300 ${
                                        activeSection === item.id
                                            ? 'bg-rose-600 text-white shadow-lg shadow-rose-600/30'
                                            : 'text-ink-600/60 hover:text-rose-600 hover:bg-rose-50'
                                    }`}
                                >
                                    <i className={`fas ${item.icon} mr-1`}></i>
                                    {item.label}
                                </motion.button>
                            ))}
                        </div>

                        <motion.button
                            whileHover={{ scale: 1.05, y: -2 }}
                            whileTap={{ scale: 0.95 }}
                            onClick={() => scrollToSection('contact')}
                            className="hidden lg:flex items-center gap-1.5 bg-ink-600 text-white px-4 py-2 rounded-full text-xs font-bold ml-1 hover:bg-rose-600 transition-all"
                        >
                            Hubungi <i className="fas fa-arrow-right text-[10px]"></i>
                        </motion.button>

                        <motion.button
                            whileTap={{ scale: 0.9 }}
                            onClick={() => setIsMobileOpen(true)}
                            className="lg:hidden w-9 h-9 rounded-full bg-rose-100 flex items-center justify-center hover:bg-rose-200 transition-colors"
                        >
                            <i className="fas fa-bars text-rose-600 text-sm"></i>
                        </motion.button>
                    </motion.nav>

                    {/* Mobile Menu */}
                    <AnimatePresence>
                        {isMobileOpen && (
                            <motion.div
                                initial={{ opacity: 0 }}
                                animate={{ opacity: 1 }}
                                exit={{ opacity: 0 }}
                                className="fixed inset-0 z-[1100] bg-ink-600/95 backdrop-blur-xl flex flex-col items-center justify-center gap-6"
                            >
                                <button
                                    onClick={() => setIsMobileOpen(false)}
                                    className="absolute top-6 right-6 text-white/80 hover:text-white text-xl"
                                >
                                    <i className="fas fa-times"></i>
                                </button>
                                {navItems.map((item, i) => (
                                    <motion.button
                                        key={item.id}
                                        initial={{ opacity: 0, x: -50 }}
                                        animate={{ opacity: 1, x: 0 }}
                                        exit={{ opacity: 0, x: -50 }}
                                        transition={{ delay: i * 0.1 }}
                                        onClick={() => scrollToSection(item.id)}
                                        className="text-2xl font-display text-white/80 hover:text-white hover:translate-x-2 transition-all"
                                    >
                                        <i className={`fas ${item.icon} mr-3 text-rose-400`}></i>
                                        {item.label}
                                    </motion.button>
                                ))}
                                <motion.button
                                    initial={{ opacity: 0 }}
                                    animate={{ opacity: 1 }}
                                    exit={{ opacity: 0 }}
                                    transition={{ delay: 0.6 }}
                                    onClick={() => scrollToSection('contact')}
                                    className="mt-4 px-8 py-3 bg-rose-500 text-white rounded-full font-bold text-lg"
                                >
                                    Hubungi Saya
                                </motion.button>
                            </motion.div>
                        )}
                    </AnimatePresence>
                </>
            );
        };

        // ==================== HERO SECTION ====================
        const Hero = () => {
            const [mousePos, setMousePos] = useState({ x: 0, y: 0 });

            const handleMouseMove = (e) => {
                setMousePos({ x: e.clientX, y: e.clientY });
            };

            const chips = [
                { label: 'IPK 3.66 / 4.00', color: 'bg-mint-400', icon: 'fa-star' },
                { label: 'BTCLS Tersertifikasi', color: 'bg-rose-400', icon: 'fa-heart-pulse' },
                { label: '5 Unit Praktik Klinik', color: 'bg-rose-600', icon: 'fa-hospital' },
            ];

            return (
                <header id="hero" className="relative min-h-screen flex items-center justify-center overflow-hidden" onMouseMove={handleMouseMove}>
                    {/* Aurora Background */}
                    <div className="absolute inset-0 aurora-bg opacity-40" />
                    
                    {/* Floating Shapes */}
                    <FloatingShapes />

                    {/* Mouse follow gradient */}
                    <div
                        className="absolute inset-0 opacity-30 pointer-events-none"
                        style={{
                            background: `radial-gradient(circle 400px at ${mousePos.x}px ${mousePos.y}px, rgba(232,37,97,0.15), transparent)`
                        }}
                    />

                    <div className="relative z-10 max-w-5xl mx-auto px-6 text-center py-20">
                        <motion.div
                            initial={{ opacity: 0, y: 20 }}
                            animate={{ opacity: 1, y: 0 }}
                            transition={{ delay: 2.5, duration: 0.8 }}
                            className="mb-6"
                        >
                            <span className="font-mono text-xs tracking-[0.2em] uppercase text-rose-600 font-bold inline-flex items-center gap-3">
                                <span className="w-6 h-0.5 bg-rose-600"></span>
                                Mahasiswa Keperawatan · Polindra
                            </span>
                        </motion.div>

                        <motion.h1
                            initial={{ opacity: 0, y: 30 }}
                            animate={{ opacity: 1, y: 0 }}
                            transition={{ delay: 2.7, duration: 0.8 }}
                            className="font-display text-5xl md:text-7xl lg:text-8xl font-bold leading-[0.9] mb-6"
                        >
                            Nabilah Aisha<br />
                            <ShinyText className="italic font-medium">Syahada</ShinyText>
                        </motion.h1>

                        <motion.p
                            initial={{ opacity: 0, y: 30 }}
                            animate={{ opacity: 1, y: 0 }}
                            transition={{ delay: 2.9, duration: 0.8 }}
                            className="max-w-xl mx-auto text-base md:text-lg text-ink-500 leading-relaxed mb-8"
                        >
                            Calon perawat profesional dengan pengalaman praktik klinik di berbagai unit — 
                            dari IGD, ICU, hingga ruang maternitas.
                        </motion.p>

                        <motion.div
                            initial={{ opacity: 0, y: 20 }}
                            animate={{ opacity: 1, y: 0 }}
                            transition={{ delay: 3.1, duration: 0.8 }}
                            className="flex gap-3 justify-center flex-wrap"
                        >
                            <motion.button
                                whileHover={{ scale: 1.05, y: -3 }}
                                whileTap={{ scale: 0.95 }}
                                onClick={() => document.getElementById('experience')?.scrollIntoView({ behavior: 'smooth' })}
                                className="px-7 py-3.5 bg-rose-600 text-white rounded-full font-bold text-sm md:text-base shadow-xl shadow-rose-600/30 hover:shadow-2xl hover:shadow-rose-600/40 transition-all flex items-center gap-2 magnetic-btn"
                            >
                                <i className="fas fa-arrow-down"></i> Lihat Pengalaman
                            </motion.button>
                            <motion.button
                                whileHover={{ scale: 1.05, y: -3 }}
                                whileTap={{ scale: 0.95 }}
                                onClick={() => document.getElementById('contact')?.scrollIntoView({ behavior: 'smooth' })}
                                className="px-7 py-3.5 border-2 border-ink-600 text-ink-600 rounded-full font-bold text-sm md:text-base hover:bg-ink-600 hover:text-white transition-all flex items-center gap-2 magnetic-btn"
                            >
                                <i className="fas fa-paper-plane"></i> Hubungi Saya
                            </motion.button>
                        </motion.div>
                    </div>

                    {/* Floating Chips - React Bits style */}
                    <motion.div
                        initial={{ opacity: 0, x: 50 }}
                        animate={{ opacity: 1, x: 0 }}
                        transition={{ delay: 3.3, duration: 0.8 }}
                        className="hidden lg:flex flex-col gap-3 absolute right-8 top-1/4 z-20"
                    >
                        {chips.map((chip, i) => (
                            <motion.div
                                key={i}
                                whileHover={{ x: -10, scale: 1.05 }}
                                animate={{ y: [0, -10, 0] }}
                                transition={{ y: { duration: 3, repeat: Infinity, delay: i * 0.8 } }}
                                className="glass px-4 py-2.5 rounded-2xl font-mono text-xs font-bold text-rose-600 flex items-center gap-2 shadow-lg cursor-default"
                            >
                                <motion.span
                                    animate={{ scale: [1, 1.3, 1] }}
                                    transition={{ duration: 2, repeat: Infinity, delay: i * 0.5 }}
                                    className={`w-2.5 h-2.5 rounded-full ${chip.color}`}
                                />
                                <i className={`fas ${chip.icon} text-[10px]`}></i>
                                {chip.label}
                            </motion.div>
                        ))}
                    </motion.div>

                    {/* Scroll Indicator */}
                    <motion.div
                        initial={{ opacity: 0 }}
                        animate={{ opacity: 0.7 }}
                        transition={{ delay: 3.5 }}
                        className="absolute bottom-8 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2"
                    >
                        <span className="font-mono text-[10px] tracking-[0.3em] uppercase text-rose-600">Gulir</span>
                        <motion.div
                            animate={{ y: [0, 12, 0] }}
                            transition={{ duration: 2, repeat: Infinity }}
                        >
                            <i className="fas fa-chevron-down text-rose-600"></i>
                        </motion.div>
                    </motion.div>
                </header>
            );
        };

        // ==================== ABOUT SECTION ====================
        const About = () => {
            const skills = [
                { name: 'Basic Nursing Skill', icon: 'fa-stethoscope' },
                { name: 'Komunikasi Terapeutik', icon: 'fa-comments' },
                { name: 'Patient Care', icon: 'fa-heart' },
                { name: 'Manajemen Waktu', icon: 'fa-clock' },
                { name: 'Problem Solving', icon: 'fa-lightbulb' },
                { name: 'Teamwork', icon: 'fa-users' },
                { name: 'Fotografi', icon: 'fa-camera' },
            ];

            return (
                <section id="about" className="relative py-24 md:py-32 bg-white overflow-hidden">
                    <div className="max-w-6xl mx-auto px-6">

                                    whileInView={{ opacity: 1, y: 0 }}
                                    viewport={{ once: true }}
                                    className="mb-12"
                                >
                                    <span className="font-mono text-xs tracking-[0.15em] uppercase text-mint-400 font-bold inline-flex items-center gap-2">
                                        <span className="w-5 h-0.5 bg-mint-400"></span>
                                        05 — Mari Terhubung
                                    </span>
                                    <h2 className="font-display text-3xl md:text-4xl lg:text-5xl font-bold mt-3 text-white">
                                        Terbuka untuk Kesempatan<br />Kerja & Magang
                                    </h2>
                                    <p className="text-white/50 mt-3">Kirim pesan lewat form, atau langsung hubungi saya.</p>
                                </motion.div>

                                <div className="grid lg:grid-cols-2 gap-10">
                                    <motion.div
                                        initial={{ opacity: 0, x: -40 }}
                                        whileInView={{ opacity: 1, x: 0 }}
                                        viewport={{ once: true }}
                                        transition={{ delay: 0.3 }}
                                        className="space-y-3"
                                    >
                                        {contacts.map((item, i) => (
                                            <motion.a
                                                key={i}
                                                href={item.href}
                                                target="_blank"
                                                whileHover={{ x: 10 }}
                                                className="flex items-center justify-between py-4 border-b border-white/10 text-white hover:text-rose-400 transition-all group"
                                            >
                                                <div className="flex items-center gap-3">
                                                    <i className={`fas ${item.icon} text-lg opacity-60 group-hover:opacity-100`}></i>
                                                    <span className="font-bold">{item.label}</span>
                                                </div>
                                                <span className="font-mono text-xs opacity-50 group-hover:opacity-100">{item.value}</span>
                                                <i className="fas fa-arrow-right opacity-0 group-hover:opacity-100 transition-all transform group-hover:translate-x-1 group-hover:-translate-y-1"></i>
                                            </motion.a>
                                        ))}
                                    </motion.div>

                                    <motion.form
                                        initial={{ opacity: 0, x: 40 }}
                                        whileInView={{ opacity: 1, x: 0 }}
                                        viewport={{ once: true }}
                                        transition={{ delay: 0.5 }}
                                        onSubmit={handleSubmit}
                                        className="space-y-4"
                                    >
                                        <input
                                            type="text"
                                            placeholder="Nama kamu"
                                            value={formState.nama}
                                            onChange={(e) => setFormState({ ...formState, nama: e.target.value })}
                                            className="w-full bg-transparent border-b border-white/20 text-white placeholder-white/30 py-3 px-1 outline-none focus:border-rose-400 transition-colors"
                                            required
                                        />
                                        <input
                                            type="email"
                                            placeholder="Email kamu"
                                            value={formState.email}
                                            onChange={(e) => setFormState({ ...formState, email: e.target.value })}
                                            className="w-full bg-transparent border-b border-white/20 text-white placeholder-white/30 py-3 px-1 outline-none focus:border-rose-400 transition-colors"
                                            required
                                        />
                                        <textarea
                                            placeholder="Tulis pesan..."
                                            value={formState.pesan}
                                            onChange={(e) => setFormState({ ...formState, pesan: e.target.value })}
                                            rows={4}
                                            className="w-full bg-transparent border-b border-white/20 text-white placeholder-white/30 py-3 px-1 outline-none focus:border-rose-400 transition-colors resize-none"
                                            required
                                        ></textarea>
                                        <motion.button
                                            whileHover={{ scale: 1.02, y: -2 }}
                                            whileTap={{ scale: 0.98 }}
                                            type="submit"
                                            disabled={isSent}
                                            className={`w-full py-3.5 rounded-full font-bold transition-all flex items-center justify-center gap-2 ${
                                                isSent
                                                    ? 'bg-mint-400 text-white'
                                                    : 'bg-rose-500 text-white hover:bg-rose-600 shadow-xl shadow-rose-500/30'
                                            }`}
                                        >
                                            {isSent ? (
                                                <><i className="fas fa-check"></i> Terkirim!</>
                                            ) : (
                                                <><i className="fas fa-paper-plane"></i> Kirim Pesan</>
                                            )}
                                        </motion.button>
                                    </motion.form>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        // ==================== FOOTER ====================
        const Footer = () => {
            const socials = [
                { icon: 'fa-linkedin-in', href: '#' },
                { icon: 'fa-instagram', href: 'https://instagram.com/bilaaishaa_' },
                { icon: 'fa-github', href: '#' },
                { icon: 'fa-whatsapp', href: 'https://wa.me/6289697007035' },
            ];

            return (
                <footer className="py-10 text-center">
                    <div className="max-w-5xl mx-auto px-6">
                        <motion.p
                            initial={{ opacity: 0, y: 20 }}
                            whileInView={{ opacity: 1, y: 0 }}
                            viewport={{ once: true }}
                            className="font-display text-2xl text-ink-600 font-bold mb-2"
                        >
                            Nabilah Aisha Syahada
                        </motion.p>
                        <p className="text-ink-400 text-sm mb-6">Mahasiswa Keperawatan · Siap Berkontribusi</p>
                        <div className="flex justify-center gap-3 mb-6">
                            {socials.map((social, i) => (
                                <motion.a
                                    key={i}
                                    href={social.href}
                                    target="_blank"
                                    whileHover={{ scale: 1.2, y: -5 }}
                                    className="w-10 h-10 rounded-full bg-rose-100 flex items-center justify-center text-rose-600 hover:bg-rose-600 hover:text-white transition-all"
                                >
                                    <i className={`fab ${social.icon}`}></i>
                                </motion.a>
                            ))}
                        </div>
                        <p className="font-mono text-xs text-ink-400/50">
                            © 2026 — Dibuat dengan ❤️ untuk Perawat Masa Depan
                        </p>
                    </div>
                </footer>
            );
        };

        // ==================== MAIN APP ====================
        const App = () => {
            const [loading, setLoading] = useState(true);
            const [activeSection, setActiveSection] = useState('hero');

            // Splash Cursor Effect
            useEffect(() => {
                const cursor = document.getElementById('splashCursor');
                if (!cursor) return;

                const handleMouseMove = (e) => {
                    cursor.style.left = e.clientX + 'px';
                    cursor.style.top = e.clientY + 'px';
                };

                const handleMouseOver = (e) => {
                    if (e.target.closest('button, a, .card-hover, [role="button"]')) {
                        cursor.classList.add('hovering');
                    }
                };

                const handleMouseOut = () => {
                    cursor.classList.remove('hovering');
                };

                document.addEventListener('mousemove', handleMouseMove);
                document.addEventListener('mouseover', handleMouseOver);
                document.addEventListener('mouseout', handleMouseOut);

                return () => {
                    document.removeEventListener('mousemove', handleMouseMove);
                    document.removeEventListener('mouseover', handleMouseOver);
                    document.removeEventListener('mouseout', handleMouseOut);
                };
            }, []);

            // Track active section on scroll
            useEffect(() => {
                const sections = ['hero', 'about', 'experience', 'certs', 'gallery', 'contact'];
                
                const handleScroll = () => {
                    const scrollPos = window.scrollY + 200;
                    
                    for (let i = sections.length - 1; i >= 0; i--) {
                        const section = document.getElementById(sections[i]);
                        if (section && section.offsetTop <= scrollPos) {
                            setActiveSection(sections[i]);
                            break;
                        }
                    }
                };

                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <>
                    <AnimatePresence>
                        {loading && <Preloader onComplete={() => setLoading(false)} />}
                    </AnimatePresence>

                    {!loading && (
                        <div className="relative">
                            <Navbar activeSection={activeSection} setActiveSection={setActiveSection} />
                            <Hero />
                            <About />
                            <Experience />
                            <Certificates />
                            <Gallery />
                            <Contact />
                            <Footer />
                        </div>
                    )}
                </>
            );
        };

        // ==================== RENDER ====================
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
